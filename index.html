<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#422322"><meta name="description" content="重返嘉节老院子，在三维院落里寻找一家四代人的回忆。">
  <title>嘉节老院子 · 四代人的回忆</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css?v=23.0">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
  <style>
#memory-preparing{position:fixed;inset:0;z-index:100;background:#090807;color:#e9dcc7;display:grid;place-content:center;text-align:center;padding:28px;font-family:"Microsoft YaHei",sans-serif}#memory-preparing h2{font:clamp(19px,3vw,28px)/1.8 "SimSun",serif;letter-spacing:3px;font-weight:400}#memory-preparing p{font-size:12px;color:#aa9984;letter-spacing:2px;line-height:2}#memory-preparing .memory-mark{font-size:12px;letter-spacing:7px;color:#b6a183}#memory-retry{color:#e9dcc7;border:1px solid #77634b;background:transparent;padding:12px 22px;margin:20px auto 0;cursor:pointer}body:has(#memory-preparing){overflow:hidden}
  </style>
</head>
<body>
  <section id="memory-preparing" role="status" aria-live="polite" aria-busy="true">
    <span class="memory-mark">嘉节 · 家的记忆</span>
    <h2>正在取出回忆手提箱</h2>
    <p id="memory-progress">正在准备这段回家的旅程，请稍候…</p>
    <button id="memory-enter" hidden>取出回忆手提箱</button>
    <button id="memory-retry" hidden onclick="location.reload()">重新准备</button>
  </section>
  <section inert id="arrival" aria-label="打开家的记忆">
    <div class="arrival-title"><span>嘉节 · 家的记忆</span><h1>把故乡，带在身边。</h1></div>
    <button id="arrival-open" aria-label="打开皮质手提箱" disabled><span>打开记忆</span></button>
    <p id="arrival-caption" role="status">正在准备一段回家的旅程…</p>
  </section>
  <header><a class="brand" href="./"><span class="seal">嘉</span><span>嘉节老院子<small>四代人的回忆</small></span></a></header>
  <main>
    <section id="scene" aria-label="可旋转与漫游的三维院落"><div id="loading" role="status">正在打开老院子的门…</div>
      <div class="compass" title="场景中的北向随相机旋转"><span id="north">↑</span>北</div>
      <div id="walk-controls" hidden>
        <div id="joystick" role="group" aria-label="移动摇杆"><span id="joystick-thumb"></span></div>
        <div class="walk-actions"><span id="walk-status" role="status"></span><button id="hall-gate">开关大门</button></div>
      </div>
    </section>
    <aside>
      <p id="hint">拖动旋转 · 滚轮或双指缩放</p>
      <label class="viewpoints" for="viewpoints">查看位置<select id="viewpoints"><option value="overview">整体院落</option><option value="entrance">门外向西看</option><option value="north">北房与地下室</option><option value="west">西侧门窗</option><option value="east">东侧门窗</option><option value="top">俯视布局</option><option value="joinery">门窗近景</option><option value="upstairs">二楼门窗近景</option><option value="rail">扶手近景</option><option value="plants">植物近景</option><option value="signage">门牌与奶箱</option><option value="pear">梨树近景</option><option value="storage">杂物间</option><option value="paving">地砖近景</option></select></label>
      <div class="tools"><button id="gate" aria-pressed="false">打开大门</button><button id="rotate" aria-pressed="true">暂停旋转</button></div>
      <section class="residents" aria-label="人物与漫游">
        <div class="resident-select"><strong>小禾</strong></div>
        <div class="tools"><button id="walk" aria-pressed="false">逛一逛院子</button><button id="ride" aria-pressed="false" disabled>骑电动车</button></div>
      </section>
      <section id="weather-panel" aria-label="太原日期与天气">
        <div class="weather-place">太原 · 嘉节 <span id="weather-date"></span></div>
        <p id="weather-summary" role="status">正在获取天气…</p>
        <small id="weather-status"></small>
        <div class="weather-actions"><label>场景天气<select id="weather-mode"><option value="live">跟随实时天气</option><option value="sun">预览晴天</option><option value="night">预览星月夜景</option><option value="rain">预览降雨</option><option value="snow">预览降雪</option><option value="wind">预览大风</option></select></label><button id="weather-refresh" aria-label="刷新实时天气">刷新</button></div>
        <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">天气数据：Open-Meteo</a>
      </section>
      <p class="eyebrow">重返记忆里的家</p><h1>院子还在，<br>回忆就有了归处。</h1>
    </aside>
  </main>
  <script type="module">
import('./app.js?v=23.0').catch(()=>{document.getElementById('memory-progress').textContent='暂时未能完成准备，请检查网络后重试。';document.getElementById('memory-preparing').setAttribute('aria-busy','false');document.getElementById('memory-retry').hidden=false;});
</script>
</body></html>
